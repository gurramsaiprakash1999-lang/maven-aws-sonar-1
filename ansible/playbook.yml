- hosts: servers
  become: yes
  tasks:
    - name: Install Java 17
      dnf:
        name: java-17-amazon-corretto
        state: present

    - name: Create app folder
      file:
        path: /opt/nexus
        state: directory

    - name: Copy Maven artifact to EC2
      copy:
        src: ../app/target/nexus-app-1.0.0.jar
        dest: /opt/nexus/nexus-app.jar

    - name: Stop old Java process if running
      shell: pkill -f java || true
      failed_when: false

    - name: Start web app in background
      shell: nohup java -jar /opt/nexus/nexus-app.jar > /opt/nexus/app.log 2>&1 &
